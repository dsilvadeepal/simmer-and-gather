name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: simmer
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: simmer
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U simmer" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://simmer:local-test-only@localhost:5432/simmer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend test -- --run
      - run: npm --prefix frontend run build
      - run: uv run python evals/run.py --mode fixtures --split all
