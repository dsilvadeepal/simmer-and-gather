services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: simmer
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: simmer
    ports: ["127.0.0.1:55444:5432"]
    volumes: ["simmer-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simmer"]
      interval: 2s
      retries: 20
volumes:
  simmer-data:
