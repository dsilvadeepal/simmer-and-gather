[project]
name = "simmer-and-gather"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
    "langgraph>=0.2",
    "langsmith>=0.3",
    "cryptography>=44",
    "python-multipart>=0.0.20",
    "pillow>=11",
    "pyjwt[crypto]>=2.10",
    "mcp>=2.3.0",
    "ortools>=9.10,<10",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/src/simmer"]
[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
asyncio_default_fixture_loop_scope = "function"
